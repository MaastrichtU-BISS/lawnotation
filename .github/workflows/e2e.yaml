name: E2E Tests

on:
  push:
    branches:
      - main
      - "feat-*"
      - dev

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ./lawnotation-ui

    env:
      SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      SMTP_URL: "smtp://127.0.0.1:1025"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: lawnotation-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('lawnotation-ui/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Show running containers
        run: docker ps -a

      - name: Wait for Supabase API
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:54321/auth/v1/health >/dev/null; then
              echo "Supabase API ready"
              exit 0
            fi
            sleep 1
          done
          echo "Supabase API not ready"
          docker ps -a
          exit 1

      - name: Check SMTP connectivity
        run: |
          for i in {1..60}; do
            if nc -z 127.0.0.1 1025; then
              echo "SMTP is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "SMTP is NOT reachable"
          docker ps -a
          docker logs supabase_inbucket_lawnotation-ui || true
          exit 1

      - name: Wait for Mailpit UI
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:54324/ >/dev/null; then
              echo "Mailpit is up"
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready in time"
          docker ps -a
          docker logs supabase_inbucket_lawnotation-ui || true
          exit 1

      - name: Run Playwright tests
        run: pnpm playwright

      - name: Capture docker stats
        if: failure()
        run: docker stats --no-stream > docker-stats.txt

      - name: Supabase logs
        if: failure()
        run: |
          docker logs supabase_auth_lawnotation-ui > supabase-auth.log 2>&1 || true
          docker logs supabase_inbucket_lawnotation-ui > supabase-mailpit.log 2>&1 || true
          docker logs supabase_db_lawnotation-ui > supabase-db.log 2>&1 || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            lawnotation-ui/docker-stats.txt
            lawnotation-ui/supabase-auth.log
            lawnotation-ui/supabase-mailpit.log
            lawnotation-ui/supabase-db.log
            lawnotation-ui/test-results/
            lawnotation-ui/playwright-report/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: lawnotation-ui/playwright-report
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: lawnotation-ui/test-results
          retention-days: 30